[tool.ruff]
line-length = 100
target-version = "py312"
exclude = ["airflow/logs", ".venv", "*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "slow: testes demorados",
    "airflow: exige apache-airflow instalado",
]
