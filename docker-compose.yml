services:
  api:
    build: .
    image: triage-api:local
    ports:
      - "8000:8000"
    environment:
      # Etapa 7 troca para onnx.
      TRIAGE_MODEL_BACKEND: sklearn
      TRIAGE_ORT_THREADS: "1"
      TRIAGE_LOG_LEVEL: INFO
    volumes:
      # Serve os modelos promovidos pelo Airflow após `docker compose restart api`;
      # sem isso a API continuaria com o modelo copiado no build da imagem.
      - ./models:/app/models:ro
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)
      interval: 15s
      timeout: 3s
      start_period: 20s
      retries: 3
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.14.0
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  grafana:
    image: grafana/grafana:13.2.2
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      # Acesso anônimo como Viewer: facilita a demonstração no vídeo.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    restart: unless-stopped

  # Orquestração do treino. Fora do `docker compose up` padrão:
  #   docker compose --profile airflow up -d --build   (UI em http://localhost:8080)
  airflow:
    profiles: ["airflow"]
    build:
      context: .
      dockerfile: airflow/Dockerfile
    image: triage-airflow:local
    command: standalone
    user: "${AIRFLOW_UID:-50000}:0"
    ports:
      # AIRFLOW_PORT permite trocar a porta do host se a 8080 estiver ocupada.
      - "${AIRFLOW_PORT:-8080}:8080"
    environment:
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      # SOMENTE DEV: desliga o login da UI.
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_ALL_ADMINS: "true"
      PYTHONPATH: /opt/airflow/src
      TRIAGE_DATA_DIR: /opt/airflow/project/data
      TRIAGE_MODEL_DIR: /opt/airflow/project/models
      TRIAGE_REPORTS_DIR: /opt/airflow/project/reports
      TRIAGE_QUALITY_GATE_F1: "0.58"
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - ./src:/opt/airflow/src
      - ./data:/opt/airflow/project/data
      - ./models:/opt/airflow/project/models
      - ./reports:/opt/airflow/project/reports

volumes:
  prometheus-data:
  grafana-data:
